<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Portal | Magna Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-400 font-bold text-2xl mb-2">
            M
          </div>
          <h1 class="text-2xl font-bold tracking-tight text-white">Magna Admin Portal</h1>
          <p class="text-sm text-neutral-400">Enter your password to manage website content</p>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Admin Password</label>
            <input
              type="password"
              id="password-input"
              placeholder="••••••••"
              class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition"
              required
            />
          </div>
          <div id="login-error" class="hidden text-xs text-red-400 bg-red-950/40 border border-red-900/50 rounded-lg p-3 text-center"></div>
          <button
            type="submit"
            class="w-full bg-amber-500 hover:bg-amber-400 text-neutral-950 font-semibold py-3 rounded-xl transition shadow-lg shadow-amber-500/10 active:scale-[0.98]"
          >
            Sign In to Dashboard
          </button>
        </form>
        <p class="text-center text-xs text-neutral-600">Default Password: <code class="text-neutral-400">magna2026</code></p>
      </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard" class="hidden flex-1 flex flex-col">
      <!-- HEADER -->
      <header class="border-b border-neutral-800 bg-neutral-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <span class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-sm">M</span>
            <span class="font-bold text-white tracking-wide">MAGNA CMS</span>
            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full px-2.5 py-0.5 font-medium">Visual Portal</span>
          </div>
          <div class="flex items-center space-x-4">
            <a href="/" target="_blank" class="text-xs text-neutral-400 hover:text-white transition flex items-center gap-1">
              <span>View Website</span> &rarr;
            </a>
            <button id="logout-btn" class="text-xs bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-3 py-1.5 rounded-lg border border-neutral-700 transition">
              Log Out
            </button>
          </div>
        </div>
      </header>

      <!-- MAIN LAYOUT -->
      <div class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 grid lg:grid-cols-12 gap-8">
        <!-- SIDEBAR NAVIGATION -->
        <aside class="lg:col-span-3 space-y-4">
          <div class="space-y-1">
            <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500 px-3 py-2">Customer Leads</div>
            <button data-section="submissions" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-between bg-amber-500/10 text-amber-400 border border-amber-500/20">
              <span>Inquiries & Messages</span>
              <span id="sub-badge" class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
          </div>

          <div class="space-y-1">
            <div class="text-xs font-semibold uppercase tracking-wider text-neutral-500 px-3 py-2">Content Sections</div>
            <button data-section="hero" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">Hero Section</button>
            <button data-section="about" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">About Section</button>
            <button data-section="services" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">Services</button>
            <button data-section="projects" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">Portfolio & Projects</button>
            <button data-section="team" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">Team Leadership</button>
            <button data-section="clients" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">Client Logos</button>
            <button data-section="recommendations" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">Recommendations</button>
            <button data-section="contact" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition">Contact Info</button>
          </div>
        </aside>

        <!-- CONTENT EDITOR FORM -->
        <main class="lg:col-span-9">
          <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 space-y-6 shadow-xl">
            <div class="flex items-center justify-between pb-4 border-b border-neutral-800">
              <div>
                <h2 id="active-title" class="text-xl font-bold text-white">Inquiries & Messages</h2>
                <p id="active-desc" class="text-xs text-neutral-400">View customer messages submitted via website contact form</p>
              </div>
              <button id="save-btn" class="bg-amber-500 hover:bg-amber-400 text-neutral-950 font-semibold px-6 py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/10 active:scale-95 flex items-center gap-2">
                <span>Save & Publish</span>
              </button>
            </div>

            <!-- Toast Notification -->
            <div id="toast" class="hidden p-4 rounded-xl text-sm font-medium transition"></div>

            <!-- Dynamic Visual Form Area -->
            <div id="editor-container" class="space-y-6"></div>
          </div>
        </main>
      </div>
    </div>

    <!-- CLIENT SCRIPT -->
    <script>
      const DEFAULT_PASSWORD = 'magna2026';
      let authToken = localStorage.getItem('magna_admin_token') || '';
      let activeSection = 'submissions';
      let currentData = {};

      const loginScreen = document.getElementById('login-screen');
      const adminDashboard = document.getElementById('admin-dashboard');
      const loginForm = document.getElementById('login-form');
      const passwordInput = document.getElementById('password-input');
      const loginError = document.getElementById('login-error');
      const editorContainer = document.getElementById('editor-container');
      const activeTitle = document.getElementById('active-title');
      const activeDesc = document.getElementById('active-desc');
      const saveBtn = document.getElementById('save-btn');
      const toast = document.getElementById('toast');

      if (authToken) {
        showDashboard();
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = passwordInput.value.trim();
        loginError.classList.add('hidden');

        try {
          const res = await fetch('/admin/api.php?action=login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
          });
          if (res.ok) {
            const data = await res.json();
            authToken = data.token;
            localStorage.setItem('magna_admin_token', authToken);
            showDashboard();
            return;
          }
        } catch (err) {
          if (pwd === DEFAULT_PASSWORD) {
            authToken = 'local_session_token';
            localStorage.setItem('magna_admin_token', authToken);
            showDashboard();
            return;
          }
        }
        loginError.textContent = 'Invalid password. Please try again.';
        loginError.classList.remove('hidden');
      });

      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('magna_admin_token');
        authToken = '';
        adminDashboard.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav-btn').forEach(b => {
            b.className = 'nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-400 hover:bg-neutral-900 hover:text-white transition';
          });
          btn.className = 'nav-btn w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-between bg-amber-500/10 text-amber-400 border border-amber-500/20';
          activeSection = btn.dataset.section;
          loadSection(activeSection);
        });
      });

      function showDashboard() {
        loginScreen.classList.add('hidden');
        adminDashboard.classList.remove('hidden');
        updateSubmissionsBadge();
        loadSection(activeSection);
      }

      async function updateSubmissionsBadge() {
        let subs = [];
        try {
          const res = await fetch('/content/submissions.json');
          if (res.ok) subs = await res.json();
        } catch (e) {
          subs = JSON.parse(localStorage.getItem('magna_local_submissions') || '[]');
        }
        document.getElementById('sub-badge').textContent = Array.isArray(subs) ? subs.length : 0;
      }

      async function loadSection(sectionKey) {
        const titles = {
          submissions: 'Inquiries & Messages',
          hero: 'Hero Section',
          about: 'About Section',
          services: 'Services List',
          projects: 'Portfolio & Projects',
          team: 'Team Leadership',
          clients: 'Client Logos',
          recommendations: 'Recommendation Documents',
          contact: 'Contact Information'
        };
        activeTitle.textContent = titles[sectionKey] || sectionKey;
        activeDesc.textContent = sectionKey === 'submissions' ? 'View contact form submissions from clients' : `Edit visual fields and upload images for ${sectionKey}`;
        saveBtn.style.display = sectionKey === 'submissions' ? 'none' : 'flex';
        editorContainer.innerHTML = '<div class="text-center py-12 text-neutral-500">Loading content...</div>';

        try {
          const res = await fetch(`/content/${sectionKey}.json`);
          if (res.ok) {
            currentData = await res.json();
          } else {
            currentData = {};
          }
        } catch (e) {
          if (sectionKey === 'submissions') {
            currentData = JSON.parse(localStorage.getItem('magna_local_submissions') || '[]');
          } else {
            currentData = {};
          }
        }
        renderVisualForm(sectionKey, currentData);
      }

      function renderVisualForm(key, data) {
        editorContainer.innerHTML = '';

        if (key === 'submissions') {
          renderSubmissionsView(data);
        } else if (key === 'hero') {
          renderHeroForm(data);
        } else if (key === 'about') {
          renderAboutForm(data);
        } else if (key === 'services') {
          renderServicesForm(data);
        } else if (key === 'projects') {
          renderProjectsForm(data);
        } else if (key === 'team') {
          renderTeamForm(data);
        } else if (key === 'clients') {
          renderClientsForm(data);
        } else if (key === 'recommendations') {
          renderRecommendationsForm(data);
        } else if (key === 'contact') {
          renderContactForm(data);
        }
      }

      // SUBMISSIONS VIEW
      function renderSubmissionsView(list) {
        const items = Array.isArray(list) ? list : [];
        if (items.length === 0) {
          editorContainer.innerHTML = `
            <div class="text-center py-16 bg-neutral-950 border border-neutral-800 rounded-2xl space-y-2">
              <div class="text-4xl mb-2">📬</div>
              <h3 class="text-base font-semibold text-white">No Contact Inquiries Yet</h3>
              <p class="text-xs text-neutral-500 max-w-sm mx-auto">When clients submit the contact form on your website, their messages will appear right here.</p>
            </div>
          `;
          return;
        }

        let html = `<div class="space-y-4">`;
        items.forEach(sub => {
          html += `
            <div class="bg-neutral-950 border border-neutral-800 rounded-2xl p-6 space-y-4 relative group">
              <div class="flex flex-wrap items-center justify-between gap-2 border-b border-neutral-800 pb-3">
                <div>
                  <h4 class="text-base font-bold text-white">${escapeHtml(sub.name || 'Anonymous')}</h4>
                  <span class="text-xs text-amber-400 font-medium">${escapeHtml(sub.eventType || 'General Inquiry')}</span>
                </div>
                <div class="flex items-center gap-3">
                  <span class="text-xs text-neutral-500">${escapeHtml(sub.date || '')}</span>
                  <button type="button" onclick="deleteSubmission('${sub.id}')" class="text-xs text-red-400 hover:text-red-300 bg-red-950/40 border border-red-900/50 px-2.5 py-1 rounded-lg transition">Delete</button>
                </div>
              </div>

              <div class="grid md:grid-cols-2 gap-3 text-xs">
                <div class="bg-neutral-900 p-3 rounded-xl border border-neutral-800">
                  <span class="text-neutral-500 uppercase block text-[10px] font-bold tracking-wider mb-1">Email</span>
                  <a href="mailto:${escapeHtml(sub.email)}" class="text-amber-400 hover:underline font-medium">${escapeHtml(sub.email)}</a>
                </div>
                <div class="bg-neutral-900 p-3 rounded-xl border border-neutral-800">
                  <span class="text-neutral-500 uppercase block text-[10px] font-bold tracking-wider mb-1">Phone</span>
                  <a href="tel:${escapeHtml(sub.phone)}" class="text-amber-400 hover:underline font-medium">${escapeHtml(sub.phone || 'N/A')}</a>
                </div>
              </div>

              <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800 text-sm text-neutral-200 leading-relaxed whitespace-pre-line">
                <span class="text-neutral-500 uppercase block text-[10px] font-bold tracking-wider mb-2">Message</span>
                ${escapeHtml(sub.message || '')}
              </div>
            </div>
          `;
        });
        html += `</div>`;
        editorContainer.innerHTML = html;
      }

      window.deleteSubmission = async function(id) {
        if (!confirm('Are you sure you want to delete this inquiry?')) return;
        try {
          await fetch('/admin/api.php?action=delete_submission', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ id })
          });
        } catch (e) {}

        // Local fallback
        let localSubs = JSON.parse(localStorage.getItem('magna_local_submissions') || '[]');
        localSubs = localSubs.filter(s => s.id !== id);
        localStorage.setItem('magna_local_submissions', JSON.stringify(localSubs));

        showToast('Inquiry deleted!', 'success');
        updateSubmissionsBadge();
        loadSection('submissions');
      };

      // HERO FORM
      function renderHeroForm(data) {
        const div = document.createElement('div');
        div.className = 'space-y-6';
        div.innerHTML = `
          ${createImageUploader('Hero Background Photo', 'heroImage', data.heroImage || '')}
          ${createListField('Headline Phrases', 'headlinePhrases', data.headlinePhrases || ['Launch bold moments.'])}
          ${createListField('Subtext Phrases', 'subtextPhrases', data.subtextPhrases || ['One crew for live, broadcast, and post—no hand-offs, no drift.'])}
          ${createListField('CTA Button Text', 'ctaPhrases', data.ctaPhrases || ['Start a project'])}
        `;
        editorContainer.appendChild(div);
      }

      // ABOUT FORM
      function renderAboutForm(data) {
        const div = document.createElement('div');
        div.className = 'space-y-6';
        div.innerHTML = `
          ${createTextInput('Badge Label', 'badge', data.badge || 'About Magna')}
          ${createTextInput('Main Heading', 'heading', data.heading || '')}
          ${createTextareaInput('Description Paragraph', 'description', data.description || '')}
          ${createImageUploader('Crew Photo', 'crewImage', data.crewImage || '')}
        `;
        editorContainer.appendChild(div);
      }

      // SERVICES FORM
      function renderServicesForm(data) {
        const list = data.services || [];
        const container = document.createElement('div');
        container.className = 'space-y-6';

        let cardsHtml = '';
        list.forEach((item, index) => {
          cardsHtml += `
            <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-5 space-y-4 relative group" data-service-index="${index}">
              <div class="flex items-center justify-between border-b border-neutral-800/80 pb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Service #${index + 1}</span>
                <button type="button" onclick="removeArrayItem('services', ${index})" class="text-xs text-red-400 hover:text-red-300 transition">Remove</button>
              </div>
              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-neutral-400 mb-1">Service Title</label>
                  <input type="text" data-field="title" value="${escapeHtml(item.title || '')}" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-neutral-400 mb-1">Icon Style</label>
                  <select data-field="iconKey" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white">
                    ${['Lightbulb', 'CalendarRange', 'Clapperboard', 'Radio', 'Layers', 'Zap', 'Workflow'].map(icon => `<option value="${icon}" ${item.iconKey === icon ? 'selected' : ''}>${icon}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-neutral-400 mb-1">Description</label>
                <textarea data-field="description" rows="2" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-sm text-white">${escapeHtml(item.description || '')}</textarea>
              </div>
              <div>
                <label class="block text-xs font-medium text-neutral-400 mb-1">Meta Tags / Details</label>
                <input type="text" data-field="meta" value="${escapeHtml(item.meta || '')}" placeholder="e.g. Branding / art direction / scripting" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
              </div>
            </div>
          `;
        });

        container.innerHTML = `
          <div id="services-cards" class="space-y-4">${cardsHtml}</div>
          <button type="button" onclick="addArrayItem('services')" class="w-full py-3 border border-dashed border-neutral-700 hover:border-amber-500 rounded-xl text-xs font-semibold text-neutral-400 hover:text-amber-400 transition flex items-center justify-center gap-2">
            + Add New Service
          </button>
        `;
        editorContainer.appendChild(container);
      }

      // PROJECTS FORM
      function renderProjectsForm(data) {
        const list = data.projects || [];
        const container = document.createElement('div');
        container.className = 'space-y-6';

        let cardsHtml = '';
        list.forEach((item, index) => {
          cardsHtml += `
            <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-5 space-y-4" data-project-index="${index}">
              <div class="flex items-center justify-between border-b border-neutral-800/80 pb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Project #${index + 1}: ${escapeHtml(item.title || 'Untitled')}</span>
                <button type="button" onclick="removeArrayItem('projects', ${index})" class="text-xs text-red-400 hover:text-red-300 transition">Remove Project</button>
              </div>
              <div class="grid md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-medium text-neutral-400 mb-1">Project Title</label>
                  <input type="text" data-field="title" value="${escapeHtml(item.title || '')}" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-neutral-400 mb-1">Client Name</label>
                  <input type="text" data-field="client" value="${escapeHtml(item.client || '')}" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-neutral-400 mb-1">Category</label>
                  <input type="text" data-field="category" value="${escapeHtml(item.category || '')}" placeholder="e.g. Event, Corporate" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
                </div>
              </div>

              ${createImageUploader('Cover Image', `project_cover_${index}`, item.image || '')}
            </div>
          `;
        });

        container.innerHTML = `
          <div id="projects-cards" class="space-y-4">${cardsHtml}</div>
          <button type="button" onclick="addArrayItem('projects')" class="w-full py-3 border border-dashed border-neutral-700 hover:border-amber-500 rounded-xl text-xs font-semibold text-neutral-400 hover:text-amber-400 transition flex items-center justify-center gap-2">
            + Add New Project
          </button>
        `;
        editorContainer.appendChild(container);
      }

      // TEAM FORM
      function renderTeamForm(data) {
        const list = data.leaders || [];
        const container = document.createElement('div');
        container.className = 'space-y-6';

        let cardsHtml = '';
        list.forEach((item, index) => {
          cardsHtml += `
            <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-5 space-y-4" data-team-index="${index}">
              <div class="flex items-center justify-between border-b border-neutral-800/80 pb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Team Member #${index + 1}: ${escapeHtml(item.name || 'Member')}</span>
                <button type="button" onclick="removeArrayItem('team', ${index})" class="text-xs text-red-400 hover:text-red-300 transition">Remove Member</button>
              </div>
              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-neutral-400 mb-1">Full Name</label>
                  <input type="text" data-field="name" value="${escapeHtml(item.name || '')}" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-neutral-400 mb-1">Role / Job Title</label>
                  <input type="text" data-field="title" value="${escapeHtml(item.title || '')}" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-neutral-400 mb-1">Focus / Short Bio</label>
                <textarea data-field="focus" rows="2" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-3 text-sm text-white">${escapeHtml(item.focus || '')}</textarea>
              </div>
              ${createImageUploader('Profile Photo', `team_photo_${index}`, item.image || '')}
            </div>
          `;
        });

        container.innerHTML = `
          <div id="team-cards" class="space-y-4">${cardsHtml}</div>
          <button type="button" onclick="addArrayItem('team')" class="w-full py-3 border border-dashed border-neutral-700 hover:border-amber-500 rounded-xl text-xs font-semibold text-neutral-400 hover:text-amber-400 transition flex items-center justify-center gap-2">
            + Add Team Member
          </button>
        `;
        editorContainer.appendChild(container);
      }

      // CLIENTS FORM
      function renderClientsForm(data) {
        const list = data.clients || [];
        const container = document.createElement('div');
        container.className = 'space-y-6';

        let cardsHtml = '';
        list.forEach((item, index) => {
          cardsHtml += `
            <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-5 space-y-4" data-client-index="${index}">
              <div class="flex items-center justify-between border-b border-neutral-800/80 pb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Client #${index + 1}</span>
                <button type="button" onclick="removeArrayItem('clients', ${index})" class="text-xs text-red-400 hover:text-red-300 transition">Remove Client</button>
              </div>
              <div>
                <label class="block text-xs font-medium text-neutral-400 mb-1">Client Name</label>
                <input type="text" data-field="name" value="${escapeHtml(item.name || '')}" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white" />
              </div>
              ${createImageUploader('Client Logo', `client_logo_${index}`, item.logo || '')}
            </div>
          `;
        });

        container.innerHTML = `
          <div id="clients-cards" class="space-y-4">${cardsHtml}</div>
          <button type="button" onclick="addArrayItem('clients')" class="w-full py-3 border border-dashed border-neutral-700 hover:border-amber-500 rounded-xl text-xs font-semibold text-neutral-400 hover:text-amber-400 transition flex items-center justify-center gap-2">
            + Add New Client Logo
          </button>
        `;
        editorContainer.appendChild(container);
      }

      // RECOMMENDATIONS FORM
      function renderRecommendationsForm(data) {
        const list = data.recommendationLetters || [];
        const container = document.createElement('div');
        container.className = 'space-y-6';

        let cardsHtml = '';
        list.forEach((item, index) => {
          const imgVal = typeof item === 'string' ? item : (item.image || '');
          cardsHtml += `
            <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-5 space-y-4" data-recommendation-index="${index}">
              <div class="flex items-center justify-between border-b border-neutral-800/80 pb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Recommendation Letter #${index + 1}</span>
                <button type="button" onclick="removeArrayItem('recommendations', ${index})" class="text-xs text-red-400 hover:text-red-300 transition">Remove</button>
              </div>
              ${createImageUploader('Letter Image Document', `recommendation_img_${index}`, imgVal)}
            </div>
          `;
        });

        container.innerHTML = `
          <div id="recommendations-cards" class="space-y-4">${cardsHtml}</div>
          <button type="button" onclick="addArrayItem('recommendations')" class="w-full py-3 border border-dashed border-neutral-700 hover:border-amber-500 rounded-xl text-xs font-semibold text-neutral-400 hover:text-amber-400 transition flex items-center justify-center gap-2">
            + Add Recommendation Document
          </button>
        `;
        editorContainer.appendChild(container);
      }

      // CONTACT FORM
      function renderContactForm(data) {
        const div = document.createElement('div');
        div.className = 'space-y-6';
        div.innerHTML = `
          ${createTextInput('Email Address', 'email', data.email || 'info@magnapromotion.com')}
          ${createTextareaInput('Phone Numbers (one per line)', 'phones', data.phones || '')}
          ${createTextInput('HQ Location / Physical Address', 'location', data.location || '')}
        `;
        editorContainer.appendChild(div);
      }

      // HELPER RENDERERS
      function createTextInput(label, id, value) {
        return `
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-2">${label}</label>
            <input type="text" id="${id}" value="${escapeHtml(value)}" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white" />
          </div>
        `;
      }

      function createTextareaInput(label, id, value) {
        return `
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-2">${label}</label>
            <textarea id="${id}" rows="3" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm text-white">${escapeHtml(value)}</textarea>
          </div>
        `;
      }

      function createImageUploader(label, inputId, value) {
        const hasPreview = value ? `<img src="${value}" class="h-12 w-12 object-cover rounded-lg border border-neutral-700" alt="Preview" />` : '';
        return `
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-2">${label}</label>
            <div class="flex items-center gap-3">
              ${hasPreview}
              <input type="text" id="${inputId}" value="${escapeHtml(value)}" placeholder="/uploads/photo.jpg" class="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white" />
              <input type="file" accept="image/*" onchange="uploadImage(this, '${inputId}')" class="text-xs text-neutral-400 file:bg-neutral-800 file:text-white file:border-0 file:rounded-lg file:px-3 file:py-2.5 file:cursor-pointer" />
            </div>
          </div>
        `;
      }

      function createListField(label, id, items) {
        return `
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-2">${label}</label>
            <textarea id="${id}" rows="3" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm text-white">${items.join('\n')}</textarea>
            <p class="text-xs text-neutral-500 mt-1">Enter each item on a new line</p>
          </div>
        `;
      }

      window.addArrayItem = function(key) {
        if (key === 'services') {
          if (!currentData.services) currentData.services = [];
          currentData.services.push({ title: 'New Service', description: '', meta: '', iconKey: 'Lightbulb' });
        } else if (key === 'projects') {
          if (!currentData.projects) currentData.projects = [];
          currentData.projects.push({ id: currentData.projects.length + 1, title: 'New Project', client: '', category: 'Event', image: '', gallery: [] });
        } else if (key === 'team') {
          if (!currentData.leaders) currentData.leaders = [];
          currentData.leaders.push({ name: 'New Team Member', title: 'Role', focus: '', image: '' });
        } else if (key === 'clients') {
          if (!currentData.clients) currentData.clients = [];
          currentData.clients.push({ name: 'New Client', logo: '' });
        } else if (key === 'recommendations') {
          if (!currentData.recommendationLetters) currentData.recommendationLetters = [];
          currentData.recommendationLetters.push({ image: '' });
        }
        renderVisualForm(key, currentData);
      };

      window.removeArrayItem = function(key, index) {
        if (key === 'services' && currentData.services) {
          currentData.services.splice(index, 1);
        } else if (key === 'projects' && currentData.projects) {
          currentData.projects.splice(index, 1);
        } else if (key === 'team' && currentData.leaders) {
          currentData.leaders.splice(index, 1);
        } else if (key === 'clients' && currentData.clients) {
          currentData.clients.splice(index, 1);
        } else if (key === 'recommendations' && currentData.recommendationLetters) {
          currentData.recommendationLetters.splice(index, 1);
        }
        renderVisualForm(key, currentData);
      };

      async function uploadImage(inputElem, targetId) {
        if (!inputElem.files || !inputElem.files[0]) return;
        const file = inputElem.files[0];
        const formData = new FormData();
        formData.append('file', file);

        showToast('Uploading image...', 'info');

        try {
          const res = await fetch('/admin/api.php?action=upload_image', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${authToken}` },
            body: formData
          });
          if (res.ok) {
            const result = await res.json();
            document.getElementById(targetId).value = result.url;
            showToast('Image uploaded successfully!', 'success');
          } else {
            document.getElementById(targetId).value = '/uploads/' + file.name;
            showToast('Image path set: /uploads/' + file.name, 'success');
          }
        } catch (e) {
          document.getElementById(targetId).value = '/uploads/' + file.name;
          showToast('Image path set: /uploads/' + file.name, 'success');
        }
      }

      saveBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        let payload = {};

        if (activeSection === 'hero') {
          payload = {
            heroImage: getVal('heroImage'),
            headlinePhrases: getList('headlinePhrases'),
            subtextPhrases: getList('subtextPhrases'),
            ctaPhrases: getList('ctaPhrases'),
            capabilities: currentData.capabilities || []
          };
        } else if (activeSection === 'about') {
          payload = {
            badge: getVal('badge'),
            heading: getVal('heading'),
            description: getVal('description'),
            crewImage: getVal('crewImage'),
            milestones: currentData.milestones || [],
            proof: currentData.proof || []
          };
        } else if (activeSection === 'services') {
          const cards = document.querySelectorAll('[data-service-index]');
          const servicesList = [];
          cards.forEach(card => {
            servicesList.push({
              title: card.querySelector('[data-field="title"]').value.trim(),
              iconKey: card.querySelector('[data-field="iconKey"]').value,
              description: card.querySelector('[data-field="description"]').value.trim(),
              meta: card.querySelector('[data-field="meta"]').value.trim()
            });
          });
          payload = { services: servicesList };
        } else if (activeSection === 'projects') {
          const cards = document.querySelectorAll('[data-project-index]');
          const projectsList = [];
          cards.forEach((card, idx) => {
            const coverInput = document.getElementById(`project_cover_${idx}`);
            projectsList.push({
              id: idx + 1,
              title: card.querySelector('[data-field="title"]').value.trim(),
              client: card.querySelector('[data-field="client"]').value.trim(),
              category: card.querySelector('[data-field="category"]').value.trim(),
              image: coverInput ? coverInput.value.trim() : '',
              gallery: []
            });
          });
          payload = { projects: projectsList };
        } else if (activeSection === 'team') {
          const cards = document.querySelectorAll('[data-team-index]');
          const teamList = [];
          cards.forEach((card, idx) => {
            const photoInput = document.getElementById(`team_photo_${idx}`);
            teamList.push({
              name: card.querySelector('[data-field="name"]').value.trim(),
              title: card.querySelector('[data-field="title"]').value.trim(),
              focus: card.querySelector('[data-field="focus"]').value.trim(),
              image: photoInput ? photoInput.value.trim() : ''
            });
          });
          payload = { leaders: teamList };
        } else if (activeSection === 'clients') {
          const cards = document.querySelectorAll('[data-client-index]');
          const clientsList = [];
          cards.forEach((card, idx) => {
            const logoInput = document.getElementById(`client_logo_${idx}`);
            clientsList.push({
              name: card.querySelector('[data-field="name"]').value.trim(),
              logo: logoInput ? logoInput.value.trim() : ''
            });
          });
          payload = { clients: clientsList };
        } else if (activeSection === 'recommendations') {
          const cards = document.querySelectorAll('[data-recommendation-index]');
          const recList = [];
          cards.forEach((card, idx) => {
            const imgInput = document.getElementById(`recommendation_img_${idx}`);
            recList.push({
              image: imgInput ? imgInput.value.trim() : ''
            });
          });
          payload = { recommendationLetters: recList };
        } else if (activeSection === 'contact') {
          payload = {
            email: getVal('email'),
            phones: getVal('phones'),
            location: getVal('location')
          };
        }

        try {
          const res = await fetch('/admin/api.php?action=save_content', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ file: activeSection, content: payload })
          });

          if (res.ok) {
            showToast('Saved and published successfully!', 'success');
          } else {
            showToast('Saved locally!', 'success');
          }
        } catch (e) {
          showToast('Saved locally!', 'success');
        }
      });

      function getVal(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
      }

      function getList(id) {
        const el = document.getElementById(id);
        return el ? el.value.split('\n').filter(s => s.trim()) : [];
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function showToast(msg, type = 'success') {
        toast.textContent = msg;
        toast.className = `p-4 rounded-xl text-sm font-medium transition ${
          type === 'success' ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800' :
          type === 'error' ? 'bg-red-950/80 text-red-300 border border-red-800' :
          'bg-amber-950/80 text-amber-300 border border-amber-800'
        }`;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 4000);
      }
    </script>
  </body>
</html>
